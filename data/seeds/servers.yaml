- slug: playwright
  name: Playwright
  vendor: Microsoft
  category: developer-tools
  official_url: https://github.com/microsoft/playwright-mcp
  repo_url: https://github.com/microsoft/playwright-mcp
  docs_url: https://playwright.dev/
  transport: stdio
  endpoint: null
  auth: none
  stdio_command: "npx -y @playwright/mcp@latest --headless"
  stdio_env: {}
  snapshot_override: null
  description: "Browser automation for agents, driven through Playwright's accessibility tree."
  tags: [official, browser, testing]

