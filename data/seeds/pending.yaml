# Servers that cannot currently be audited, parked out of the live directory.
#
# This file is NOT read by the app. Nothing here gets a page, a sitemap entry or
# a slot in the hub — the directory only ever shows servers with a real surface,
# and a scorecard with no score is worse than no scorecard.
#
# Entries keep their full seed so moving one back into servers.yaml is a cut and
# paste once it becomes scannable. The `# blocked:` line on each records what the
# scanner actually got, so nobody re-derives it.
#
# To check whether any of these has opened up:
#
#   npm run scan -- --pending
#
# That attempts each one and reports what would now succeed, writing nothing.
# Most are behind OAuth and will only ever be publishable from a
# `snapshot_override` their maintainers provide.

# --- developer-tools -----------------------------------------------------------

- slug: github
  # blocked: 401 — missing required Authorization header
  name: GitHub
  vendor: GitHub
  category: developer-tools
  official_url: https://github.com/github/github-mcp-server
  repo_url: https://github.com/github/github-mcp-server
  docs_url: https://docs.github.com/en/copilot/customizing-copilot/using-model-context-protocol
  transport: remote
  endpoint: https://api.githubcopilot.com/mcp/
  auth: oauth
  stdio_command: null
  stdio_env: {}
  snapshot_override: null
  description: "Official GitHub MCP server for repositories, issues, pull requests and Actions."
  tags: [official, git, code-review]

- slug: gitlab
  # blocked: publishes tools whose inputSchema.type is not "object"; the MCP SDK client refuses to parse the response
  name: GitLab
  vendor: GitLab
  category: developer-tools
  official_url: https://github.com/modelcontextprotocol/servers/tree/main/src/gitlab
  repo_url: https://github.com/modelcontextprotocol/servers
  docs_url: https://docs.gitlab.com/ee/user/gitlab_duo/
  transport: stdio
  endpoint: null
  auth: apikey
  stdio_command: "npx -y @modelcontextprotocol/server-gitlab"
  stdio_env:
    GITLAB_PERSONAL_ACCESS_TOKEN: "dummy"
    GITLAB_API_URL: "https://gitlab.com/api/v4"
  snapshot_override: null
  description: "Reference GitLab MCP server covering projects, issues and merge requests."
  tags: [git, code-review]

